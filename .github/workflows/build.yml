name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # Unsigned: the phone-side signing happens on Linux with a free Apple ID.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Maro.xcodeproj \
            -scheme Maro \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*(Sources)|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Maro.app

      - name: Package ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Maro.app Payload/
          zip -qr Maro.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Maro-ipa
          path: Maro.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
