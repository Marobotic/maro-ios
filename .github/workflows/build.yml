name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      # The Spotify player: the desktop's librespot helper (spotify/), as a
      # static library the app links (Spotify-Bridging.h).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spotify

      - name: Spotify player (Rust, aarch64-apple-ios)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        run: |
          rustup target add aarch64-apple-ios
          cd spotify
          cargo rustc --release --lib --target aarch64-apple-ios --crate-type staticlib 2>&1 | tail -40
          test -f target/aarch64-apple-ios/release/libjukebox_spotify.a

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # Unsigned: the phone-side signing happens on Linux with a free Apple ID.
      - name: Build
        run: |
          xcodebuild \
            -project Maro.xcodeproj \
            -scheme Maro \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u; exit 1; }
          grep -E "Sources/.*warning:" build.log | sort -u || true

      - name: Package ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Maro.app Payload/
          zip -qr Maro.ipa Payload

      # The newest build as an asset of one rolling release in this (private)
      # repo: release assets do not count against the account's Actions
      # storage, which ran out and failed a good build at the upload.
      # `mdeploy ios update Marobotic/maro-ios --tag latest-build` installs it.
      - name: Publish to the latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build >/dev/null 2>&1 || \
            gh release create latest-build --prerelease --title "Latest build" \
              --notes "The newest build from main, replaced on every push."
          gh release upload latest-build Maro.ipa --clobber

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Maro-ipa
          path: Maro.ipa
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
