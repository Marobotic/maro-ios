name: Maro
options:
  bundleIdPrefix: dev.marobotic
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.6"
    CURRENT_PROJECT_VERSION: "7"
targets:
  Maro:
    type: application
    platform: iOS
    sources:
      - Maro/Sources
      - Maro/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.marobotic.maro
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Maro/Info.plist
      properties:
        CFBundleDisplayName: Jukebox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # The Android splash: the logo centred on the panel background.
        UILaunchScreen:
          UIColorName: SplashBackground
          UIImageName: LaunchNote
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Keeps playback going with the screen off or the app in the background.
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - jetbrainsmono_nerd_regular.ttf
          - jetbrainsmono_nerd_bold.ttf
