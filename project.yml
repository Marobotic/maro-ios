name: Maro
options:
  bundleIdPrefix: dev.marobotic
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.8"
    CURRENT_PROJECT_VERSION: "45"
targets:
  Maro:
    type: application
    platform: iOS
    sources:
      - Maro/Sources
      - Maro/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.marobotic.maro
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Spotify: the desktop's librespot helper, built by CI from spotify/
        # into a static library (see Spotify.swift).
        SWIFT_OBJC_BRIDGING_HEADER: Maro/Sources/Spotify-Bridging.h
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/spotify/target/aarch64-apple-ios/release
        OTHER_LDFLAGS: -ljukebox_spotify -lresolv -framework Security -framework SystemConfiguration -framework CoreAudio -framework AudioToolbox -framework AVFoundation
    info:
      path: Maro/Info.plist
      properties:
        CFBundleDisplayName: Jukebox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # The Android splash: the logo centred on the panel background.
        UILaunchScreen:
          UIColorName: SplashBackground
          UIImageName: LaunchNote
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Round 2 I: the local route between this account's devices on the same Wi-Fi.
        NSLocalNetworkUsageDescription: Jukebox talks to your other devices on this network (your PC, other phones) so a sign-in on one works on all of them.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Keeps playback going with the screen off or the app in the background.
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - jetbrainsmono_nerd_regular.ttf
          - jetbrainsmono_nerd_bold.ttf
  # Round 2 I.6: the device-to-device crypto, alone, against the shared interop
  # vector (design/round2-hpke-vector.json). macOS, so no simulator is needed.
  MaroCryptoTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Maro/Sources/DeviceCrypto.swift
      - path: MaroTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.marobotic.maro.cryptotests
        CODE_SIGN_IDENTITY: "-"
schemes:
  Maro:
    build:
      targets:
        Maro: all
  MaroCryptoTests:
    build:
      targets:
        MaroCryptoTests: [test]
    test:
      targets:
        - MaroCryptoTests
